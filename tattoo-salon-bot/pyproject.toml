[project]
name = "tattoo-salon-bot"
version = "1.0.0"
description = "Telegram-бот тату-салона: график работы мастеров и график затрат"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
